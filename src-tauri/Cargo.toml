[package]
name = "mcdii-modmanager"
version = "1.0.6"
description = "A Mod Manager for Minecraft Dungeons II"
authors = ["thororen1234"]
edition = "2021"

[lib]
name = "mcdii_modmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
walkdir = "2"
open = "5"
dirs = "5"
# Same HTTP client and TLS setup as tauri-plugin-updater, so nothing new is compiled in.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
