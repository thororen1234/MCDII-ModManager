[package]
name = "mcdii-modmanager"
version = "1.0.4"
description = "A Mod Manager for Minecraft Dungeons II"
authors = ["thororen1234"]
edition = "2021"

[lib]
name = "mcdii_modmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
walkdir = "2"
open = "5"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
